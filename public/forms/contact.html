<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Contact form</title>
  </head>
  <body>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="website" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="text" name="preferred_contact" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="social" />
      <input type="text" name="country_timezone" />
      <input type="text" name="website_url" />
      <input type="text" name="offer_summary" />
      <input type="text" name="tried_before" />
      <input type="text" name="looking_for" />
      <input type="text" name="bottlenecks" />
      <input type="text" name="start_timing" />
      <input type="text" name="decision_context" />
      <input type="text" name="paid_diagnostic_readiness" />
      <textarea name="message"></textarea>
      <input type="text" name="lang" />
      <input type="text" name="track" />
      <input type="text" name="source_path" />
      <input type="text" name="website" />
    </form>
  </body>
</html>
