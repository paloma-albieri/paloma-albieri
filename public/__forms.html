<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Contact form</title>
  </head>
  <body>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="website" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="email" name="email" />
      <input type="text" name="other_contact" />
      <input type="text" name="country_timezone" />
      <input type="text" name="preferred_language" />
      <input type="text" name="website_url" />
      <textarea name="offer_summary"></textarea>
      <textarea name="main_customer"></textarea>
      <textarea name="motivation"></textarea>
      <textarea name="business_impact"></textarea>
      <textarea name="tried_before"></textarea>
      <textarea name="desired_outcome"></textarea>
      <textarea name="current_tools"></textarea>
      <input type="text" name="looking_for" />
      <input type="text" name="start_timing" />
      <input type="text" name="decision_context" />
      <input type="text" name="investment_range" />
      <textarea name="materials"></textarea>
      <input type="text" name="free_triage_consent" />
      <input type="text" name="information_consent" />
      <input type="text" name="paid_diagnostic_readiness" />
      <textarea name="message"></textarea>
      <input type="hidden" name="lang" />
      <input type="hidden" name="track" />
      <input type="hidden" name="source_path" />
      <input type="hidden" name="utm_source" />
      <input type="hidden" name="utm_medium" />
      <input type="hidden" name="utm_campaign" />
      <input type="hidden" name="referrer_host" />
      <input type="hidden" name="landing_path" />
      <input type="hidden" name="triage_type" value="initial_triage" />
      <input type="hidden" name="triage_depth" />
      <input type="text" name="website" />
      <!-- Keep historical fields registered so earlier submissions remain visible. -->
      <input type="hidden" name="preferred_contact" />
      <input type="hidden" name="phone" />
      <input type="hidden" name="social" />
      <input type="hidden" name="bottlenecks" />
    </form>
  </body>
</html>
